<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiplication Flash Cards</title>
<meta name="description" content="Multiplication flash cards, 1 through 12. Outrun the cat, one table at a time.">
<meta name="x-cards-version" content="1.5">
<meta name="theme-color" content="#f7f4ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee; --ink:#20242e; --muted:#7b7a74; --line:#e2ddd2;
    --blue:#2f6df6; --blue-dark:#1d4fc4; --blue-soft:#eaf0ff;
    --green:#1f9d63; --green-dark:#177a4d; --green-soft:#e4f6ec;
    --red:#e0524a; --red-soft:#fdeceb; --amber:#f0a12e;
    --font:'Fredoka',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

  .screen{flex:1;display:none;flex-direction:column;padding:22px;max-width:560px;width:100%;margin:0 auto}
  .screen.on{display:flex}

  /* ---------- home ---------- */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:10px}
  .title{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .title span{color:var(--blue)}
  .sub{color:var(--muted);font-size:16px;margin-top:8px;margin-bottom:26px}

  .spk{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);
    background:#fff;font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease,background .18s ease}
  .spk:active{transform:scale(.92)}
  .spk.off{color:#b9b5ab;background:#f1eee7}

  .label{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin-bottom:12px}
  .block{margin-bottom:26px}
  .block.hide{display:none}
  .note{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.45}

  .chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .chip{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--line);border-radius:14px;background:#fff;
    font-size:19px;font-weight:600;color:var(--muted);
    transition:transform .12s ease,background .18s ease,border-color .18s ease,color .18s ease}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip:active{transform:scale(.93)}
  .quick{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .quick button{font-size:14px;font-weight:500;color:var(--blue);
    border:2px solid var(--line);border-radius:999px;padding:7px 16px;background:#fff}
  .quick button:active{background:var(--blue-soft)}
  .quick button.warn{color:var(--muted)}

  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opts.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .opt{border:2px solid var(--line);border-radius:999px;background:#fff;
    padding:11px 18px;font-size:16px;font-weight:500;color:var(--muted);
    transition:transform .12s ease,background .18s ease,border-color .18s ease,color .18s ease}
  .opt.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .opt:active{transform:scale(.95)}
  .opts.four .opt{padding:11px 4px;text-align:center}

  /* trouble spots */
  .misses{display:flex;flex-wrap:wrap;gap:8px}
  .miss{border:2px solid #f3cdc9;background:var(--red-soft);color:#a8352e;
    border-radius:12px;padding:8px 13px;font-size:16px;font-weight:600}
  .miss em{font-style:normal;font-size:12px;font-weight:600;margin-left:8px;
    background:#d9605780;color:#fff;border-radius:999px;padding:1px 7px;vertical-align:1px}

  /* who is chasing who */
  .pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pair{border:2px solid var(--line);border-radius:16px;background:#fff;padding:12px 4px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:transform .12s ease,background .18s ease,border-color .18s ease}
  .pair .duo{font-size:23px;line-height:1;letter-spacing:1px}
  .pair .who{font-size:12px;font-weight:500;color:var(--muted);line-height:1.2;text-align:center}
  .pair.on{background:var(--blue-soft);border-color:var(--blue)}
  .pair.on .who{color:var(--blue-dark)}
  .pair:active{transform:scale(.94)}
  .label.pairgap{margin-top:24px}

  /* difficulty slider */
  .slide{display:flex;align-items:center;gap:14px}
  .slide input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:10px;
    border-radius:999px;outline:none;
    background:linear-gradient(90deg,var(--red),var(--amber),var(--green))}
  .slide input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
  .slide input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;
    background:#fff;border:3px solid var(--ink);cursor:pointer}
  .slide .lvl{flex:none;width:96px;text-align:right;font-size:15px;font-weight:600}

  .start{margin-top:auto;background:var(--blue);color:#fff;border-radius:20px;
    padding:20px;font-size:21px;font-weight:600;width:100%;
    box-shadow:0 6px 0 var(--blue-dark);transition:transform .1s ease,box-shadow .1s ease}
  .start:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-dark)}
  .start[disabled]{background:#c9c6bd;box-shadow:0 6px 0 #b3b0a7;cursor:default}

  /* ---------- play ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .count{font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .score{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
  .score b{color:var(--green);font-weight:600}
  .score i{color:var(--red);font-style:normal;font-weight:600;margin-left:10px}
  .topbtns{display:flex;align-items:center;gap:2px}
  .quit{font-size:15px;font-weight:500;color:var(--muted);padding:6px 8px}
  .spk.mini{width:34px;height:34px;border-radius:11px;font-size:16px;border-width:2px}

  .track{height:8px;border-radius:999px;background:var(--line);margin-top:12px;overflow:hidden}
  .track .fill{height:100%;width:100%;background:var(--green);border-radius:999px;transform-origin:left center}
  .track .fill.warn{background:var(--amber)}
  .track.hidden{display:none}

  /* ---------- the chase ---------- */
  .lane{position:relative;height:64px;margin-top:10px;display:none}
  .lane.on{display:block}
  .lane .ground{position:absolute;left:0;right:0;bottom:12px;height:3px;border-radius:2px;
    background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
  /* left matches HOLE in the script, so the runner finishes dead centre of it */
  .lane .hole{position:absolute;bottom:9px;left:88%;transform:translateX(-50%);
    width:46px;height:26px;border-radius:50%;
    background:#3a3730;box-shadow:inset 0 3px 5px rgba(0,0,0,.5)}
  /* pairs that run for a tree or a rock instead of a hole in the ground */
  .lane .hole.emoji{bottom:10px;width:auto;height:auto;border-radius:0;
    background:none;box-shadow:none;font-size:30px;line-height:1}
  .lane .runner{position:absolute;bottom:12px;font-size:29px;line-height:1;
    transform:translateX(-50%);will-change:left}
  /* the mouse only moves when a card is answered, so let it scurry */
  .lane .mouse{z-index:2;transition:left .45s cubic-bezier(.3,.8,.35,1)}
  .lane .cat{z-index:1}
  .lane.close .ground{background:repeating-linear-gradient(90deg,#f2c9c6 0 10px,transparent 10px 18px)}
  .lane.close .cat{animation:lunge .5s ease-in-out infinite}
  @keyframes lunge{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.16)}}
  .lane .roundtag{position:absolute;top:-2px;left:0;font-size:13px;font-weight:600;color:var(--muted)}
  .lane .gap{position:absolute;top:-2px;right:0;font-size:13px;font-weight:600;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .lane.close .gap{color:var(--red)}
  .pounce{animation:pounce .45s ease-out}
  @keyframes pounce{0%{transform:translateX(-50%) rotate(0)}
    35%{transform:translateX(-50%) rotate(-14deg) scale(1.25)}
    100%{transform:translateX(-50%) rotate(0)}}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}
  .card{width:100%;aspect-ratio:1/1;max-height:58vh;position:relative;
    transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.8,.35,1)}
  .card.flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;border-radius:30px;background:#fff;
    border:2px solid var(--line);box-shadow:0 10px 26px rgba(32,36,46,.08);
    -webkit-backface-visibility:hidden;backface-visibility:hidden}
  .face.back{transform:rotateY(180deg);background:var(--blue-soft);border-color:#cfdcff}
  .q{font-size:clamp(46px,15vw,84px);font-weight:600;letter-spacing:.01em;line-height:1}
  .a{font-size:clamp(64px,22vw,120px);font-weight:700;color:var(--blue);line-height:1}
  .qsmall{font-size:20px;font-weight:500;color:var(--muted);margin-bottom:14px}

  /* multiple choice: the card and the buttons split the screen between them */
  body.choice .stage{flex:1;align-items:stretch;padding:14px 0 10px}
  body.choice .card{aspect-ratio:auto;height:auto;max-height:none}
  .choices{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
  body.choice .choices{display:grid;flex:1.15;grid-template-rows:1fr 1fr}
  body.choice .hint,body.choice .grade,body.choice .next{display:none}
  .ch{border:2px solid var(--line);border-radius:20px;background:#fff;padding:22px 8px;
    font-size:30px;font-weight:600;box-shadow:0 4px 0 #ded8cc;
    transition:transform .1s ease,box-shadow .1s ease,background .2s ease,border-color .2s ease,color .2s ease}
  .ch:active{transform:translateY(3px);box-shadow:0 1px 0 #ded8cc}
  .ch.good{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
  .ch.bad{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 0 #b93f38;animation:shake .45s}
  .ch.dim{opacity:.4}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

  .hint{text-align:center;color:var(--muted);font-size:15px;min-height:24px;margin-bottom:8px}
  .next{background:var(--blue);color:#fff;border-radius:20px;padding:18px;
    font-size:19px;font-weight:600;width:100%;box-shadow:0 6px 0 var(--blue-dark);
    transition:transform .1s ease,box-shadow .1s ease}
  .next:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-dark)}
  .grade{display:none;grid-template-columns:1fr 1fr;gap:12px}
  .grade.on{display:grid}
  .gbtn{border-radius:20px;padding:18px;font-size:18px;font-weight:600;color:#fff}
  .gbtn.yes{background:var(--green);box-shadow:0 6px 0 var(--green-dark)}
  .gbtn.no{background:#8d8981;box-shadow:0 6px 0 #6f6c65}
  .gbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}

  .toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-14px);z-index:50;
    background:var(--ink);color:#fff;font-size:16px;font-weight:600;
    padding:11px 22px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s cubic-bezier(.2,.9,.3,1)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.big{font-size:19px;padding:15px 28px;background:var(--green)}

  /* ---------- done ---------- */
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  .done .emoji{font-size:56px;line-height:1.1}
  .done .big{font-size:34px;font-weight:700}
  .done .ring{font-size:58px;font-weight:700;color:var(--blue);line-height:1.15}
  .done .stat{font-size:17px;color:var(--muted)}
  .missbox{margin-top:22px;width:100%;max-width:400px;border:2px solid var(--line);
    background:#fff;border-radius:20px;padding:16px 18px;display:none}
  .missbox.on{display:block}
  .missbox .label{margin-bottom:10px;text-align:left}
  .missbox .misses{justify-content:flex-start}
  .again{background:var(--blue);color:#fff;border-radius:20px;padding:18px 34px;
    font-size:19px;font-weight:600;margin-top:24px;box-shadow:0 6px 0 var(--blue-dark);
    transition:transform .1s ease,box-shadow .1s ease}
  .again:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-dark)}
  .link{margin-top:14px;font-size:16px;font-weight:500;color:var(--blue);padding:8px}

  .foot{text-align:center;color:#b4b0a6;font-size:12px;padding:14px 0 4px}

  @media (prefers-reduced-motion:reduce){
    .card,.chip,.opt,.start,.next,.again,.ch,.toast{transition:none}
    .ch.bad,.lane.close .cat,.pounce{animation:none}
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ================= home ================= -->
<div class="screen on" id="home">
  <div class="head">
    <h1 class="title">Multiplication<br><span>Flash Cards</span></h1>
    <button type="button" class="spk" id="spkHome" aria-label="Sound">🔊</button>
  </div>
  <p class="sub">Pick your tables, then start.</p>

  <div class="block hide" id="troubleBlock">
    <p class="label">Keeps missing these</p>
    <div class="misses" id="troubleList"></div>
    <div class="quick">
      <button type="button" id="practiceBtn">Practice just these</button>
      <button type="button" class="warn" id="clearMissBtn">Clear the record</button>
    </div>
  </div>

  <div class="block">
    <p class="label">Tables</p>
    <div class="chips" id="chips"></div>
    <div class="quick">
      <button type="button" id="allBtn">All</button>
      <button type="button" id="noneBtn">None</button>
    </div>
  </div>

  <div class="block">
    <p class="label">How to answer</p>
    <div class="opts" id="modeOpts">
      <button type="button" class="opt on" data-mode="flip">Flip the card</button>
      <button type="button" class="opt" data-mode="choice">Pick the answer</button>
    </div>
  </div>

  <div class="block">
    <p class="label">Order</p>
    <div class="opts" id="orderOpts">
      <button type="button" class="opt" data-shuffle="0">In order</button>
      <button type="button" class="opt on" data-shuffle="1">Shuffle</button>
    </div>
  </div>

  <div class="block">
    <p class="label">Timer</p>
    <div class="opts" id="timerOpts">
      <button type="button" class="opt on" data-timer="off">Off</button>
      <button type="button" class="opt" data-timer="card">Per card</button>
      <button type="button" class="opt" data-timer="chase">🐾 Chase</button>
    </div>
  </div>

  <div class="block hide" id="secsBlock">
    <p class="label">Seconds per card</p>
    <div class="opts four" id="secsOpts">
      <button type="button" class="opt" data-secs="3">3s</button>
      <button type="button" class="opt on" data-secs="5">5s</button>
      <button type="button" class="opt" data-secs="10">10s</button>
      <button type="button" class="opt" data-secs="20">20s</button>
    </div>
  </div>

  <div class="block hide" id="chaseBlock">
    <p class="label">Who is chasing who</p>
    <div class="pairs" id="pairOpts"></div>

    <p class="label pairgap">How long per card</p>
    <div class="slide">
      <input type="range" min="3" max="20" step="1" id="pace" aria-label="Seconds per card">
      <span class="lvl" id="paceLabel">10s a card</span>
    </div>
    <p class="note" id="chaseNote"></p>
  </div>

  <button type="button" class="start" id="startBtn">Start</button>
  <p class="foot">v1.5</p>
</div>

<!-- ================= play ================= -->
<div class="screen" id="play">
  <div class="top">
    <span class="count" id="count">1 / 12</span>
    <span class="score" id="score"></span>
    <span class="topbtns">
      <button type="button" class="spk mini" id="spkPlay" aria-label="Sound">🔊</button>
      <button type="button" class="quit" id="quitBtn">Done</button>
    </span>
  </div>

  <div class="track hidden" id="track"><div class="fill" id="fill"></div></div>

  <div class="lane" id="lane">
    <span class="roundtag" id="roundTag"></span>
    <span class="gap" id="gapTag"></span>
    <div class="ground"></div>
    <div class="hole" id="hole"></div>
    <div class="runner mouse" id="mouse">🐭</div>
    <div class="runner cat" id="cat">🐱</div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front"><div class="q" id="q">1 × 1</div></div>
      <div class="face back">
        <div class="qsmall" id="qsmall">1 × 1</div>
        <div class="a" id="a">1</div>
      </div>
    </div>
  </div>

  <div class="choices" id="choices"></div>

  <p class="hint" id="hint">Tap the card to see the answer</p>
  <div class="grade" id="grade">
    <button type="button" class="gbtn yes" id="gotIt">I got it</button>
    <button type="button" class="gbtn no" id="missedIt">Missed it</button>
  </div>
  <button type="button" class="next" id="nextBtn">Show answer</button>
</div>

<!-- ================= done ================= -->
<div class="screen" id="doneScreen">
  <div class="done">
    <div class="emoji" id="doneEmoji"></div>
    <div class="big" id="doneTitle">Nice work</div>
    <div class="ring" id="doneRing"></div>
    <div class="stat" id="doneCards">12 cards</div>
    <div class="stat" id="doneStreak"></div>
    <div class="stat" id="doneTime">in 1:12</div>

    <div class="missbox" id="missBox">
      <p class="label">Missed this time</p>
      <div class="misses" id="missList"></div>
    </div>

    <button type="button" class="again" id="againBtn">Go again</button>
    <button type="button" class="link" id="changeBtn">Change settings</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var MIN = 1, MAX = 12, PER_TABLE = MAX - MIN + 1;
  var STORE = 'seth-cards-settings-v4';
  var MISSES = 'seth-cards-misses-v1';

  /* The chase is a straight race down one track, both starting on the left.
     The MOUSE is how many cards you have got RIGHT, so only a correct answer
     moves it. The CAT is how much of the time budget you have burned.
     Budget is seconds-per-card times the cards in the round, so at 10s a
     card the mouse has 120 seconds to get home over 12 cards. Finish under
     that and it makes the hole, run over and the cat has it.
     A miss sends the card to the back of the queue to come round again, so
     it costs you an extra card, paid in the only currency here: time. */
  var HEAD = 22;          // the runner's head start, in track units
  var LANE_L = 3, HOLE = 88;   // HOLE must match .lane .hole{left:} in the CSS

  // who is chasing whom. `home` is the safe place at the end of the lane;
  // an empty one falls back to the drawn mouse hole.
  var PAIRS = [
    {key:'cat',   chaser:'🐱', runner:'🐭', home:'',   chaserName:'cat',   runnerName:'mouse'},
    {key:'dino',  chaser:'🦖', runner:'🦒', home:'🌳', chaserName:'dino',  runnerName:'giraffe'},
    {key:'lion',  chaser:'🐭', runner:'🦁', home:'🪨', chaserName:'mouse', runnerName:'lion'},
    {key:'shark', chaser:'🦈', runner:'🐠', home:'🪸', chaserName:'shark', runnerName:'fish'},
    {key:'wolf',  chaser:'🐺', runner:'🐑', home:'🛖', chaserName:'wolf',  runnerName:'sheep'},
    {key:'bee',   chaser:'🐝', runner:'🐻', home:'🌲', chaserName:'bee',   runnerName:'bear'}
  ];
  function pair(){
    for (var i = 0; i < PAIRS.length; i++) if (PAIRS[i].key === state.pair) return PAIRS[i];
    return PAIRS[0];
  }

  var state = {
    tables: [], mode: 'flip', shuffle: true,
    timer: 'off', secs: 5, pace: 10, pair: 'cat', sound: true,
    rounds: [], roundIdx: 0,
    queue: [], total: 0, cleared: 0,
    revealed: false, answered: false,
    right: 0, wrong: 0, streak: 0, bestStreak: 0,
    missed: [], startedAt: 0, caught: false, practice: false
  };

  var el = {};
  ['home','play','doneScreen','chips','allBtn','noneBtn','modeOpts','orderOpts','timerOpts',
   'secsBlock','secsOpts','chaseBlock','pairOpts','pace','paceLabel','chaseNote',
   'troubleBlock','troubleList','practiceBtn','clearMissBtn',
   'startBtn','count','score','quitBtn','track','fill','lane','cat','mouse','hole','roundTag','gapTag',
   'card','q','qsmall','a','choices','hint','grade','gotIt','missedIt','nextBtn','toast',
   'spkHome','spkPlay','doneEmoji','doneTitle','doneRing','doneCards','doneStreak','doneTime',
   'missBox','missList','againBtn','changeBtn'
  ].forEach(function(id){ el[id] = document.getElementById(id); });

  /* =========================================================
     Sound. Synthesised with Web Audio, so there is nothing to
     download. iOS refuses to start audio before a real gesture,
     so the context is only built and resumed from inside a tap.
     ========================================================= */
  var actx = null, master = null;

  function audio(){
    if (actx) return actx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = state.sound ? 0.9 : 0;
      master.connect(actx.destination);
    } catch(e){ actx = null; }
    return actx;
  }
  function unlock(){
    var c = audio();
    if (c && c.state === 'suspended' && c.resume) c.resume();
  }
  function applyMute(){
    if (master) master.gain.value = state.sound ? 0.9 : 0;
    var icon = state.sound ? '🔊' : '🔇';
    el.spkHome.textContent = icon; el.spkPlay.textContent = icon;
    el.spkHome.classList.toggle('off', !state.sound);
    el.spkPlay.classList.toggle('off', !state.sound);
  }

  function tone(f, at, dur, type, vol, to){
    var c = audio();
    if (!c || !state.sound) return;
    var t0 = c.currentTime + at;
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  var sfx = {
    flip:  function(){ tone(620, 0, .05, 'sine', .07); tone(920, .035, .05, 'sine', .05); },
    tap:   function(){ tone(680, 0, .04, 'sine', .06); },
    right: function(){ var n=[523.25,659.25,783.99,1046.5];
             for (var i=0;i<n.length;i++) tone(n[i], i*.075, .18, 'triangle', .17); },
    wrong: function(){ tone(392,0,.22,'triangle',.16,196); tone(196,.17,.26,'triangle',.13,147); },
    timeUp:function(){ tone(330,0,.3,'sine',.13,196); },
    streak:function(){ var n=[784,988,1175,1568];
             for (var i=0;i<n.length;i++) tone(n[i], i*.055, .13, 'sine', .12); },
    // the cat lunging forward after a wrong answer
    pounce:function(){ tone(150, 0, .16, 'sawtooth', .09, 90); },
    // squeak, then the mouse is down the hole
    escape:function(){ tone(1568,0,.09,'sine',.14,2093); tone(1318,.09,.09,'sine',.12,1760);
             var n=[523.25,783.99,1046.5]; for (var i=0;i<n.length;i++) tone(n[i], .22+i*.09, .24,'triangle',.15); },
    caught:function(){ tone(300,0,.45,'sawtooth',.13,70); tone(220,.1,.5,'triangle',.11,60); },
    done:  function(){ var n=[523.25,659.25,783.99,1046.5];
             for (var i=0;i<n.length;i++) tone(n[i], i*.11, .22, 'triangle', .16);
             tone(783.99,.46,.5,'triangle',.14); tone(1046.5,.46,.6,'triangle',.13); }
  };

  /* ---------- the missed record ---------- */
  var record = {};   // "7×8" -> {m: missed, h: hit}

  function loadRecord(){
    try { record = JSON.parse(localStorage.getItem(MISSES)) || {}; } catch(e){ record = {}; }
    if (!record || typeof record !== 'object') record = {};
  }
  function saveRecord(){
    try { localStorage.setItem(MISSES, JSON.stringify(record)); } catch(e){}
  }
  function noteResult(key, correct){
    var r = record[key] || (record[key] = {m: 0, h: 0});
    if (correct) r.h++; else r.m++;
    saveRecord();
  }
  // worst first: most misses, and a recent miss outranks an old one that has since been learned
  function troubleList(limit){
    var out = [];
    for (var k in record){
      if (record[k] && record[k].m > 0) out.push({key: k, m: record[k].m, h: record[k].h});
    }
    out.sort(function(a, b){ return (b.m - b.h * 0.5) - (a.m - a.h * 0.5) || b.m - a.m; });
    return limit ? out.slice(0, limit) : out;
  }
  function keyToPair(k){ var p = k.split('×'); return [parseInt(p[0],10), parseInt(p[1],10)]; }
  function pairKey(a, b){ return a + '×' + b; }

  /* ---------- settings ---------- */
  function loadSettings(){
    state.tables = [];
    for (var n = MIN; n <= MAX; n++) state.tables.push(n);
    try {
      var s = JSON.parse(localStorage.getItem(STORE));
      if (s){
        if (Array.isArray(s.tables) && s.tables.length) state.tables = s.tables;
        if (s.mode === 'flip' || s.mode === 'choice') state.mode = s.mode;
        if (typeof s.shuffle === 'boolean') state.shuffle = s.shuffle;
        if (s.timer === 'off' || s.timer === 'card' || s.timer === 'chase') state.timer = s.timer;
        if (typeof s.secs === 'number' && s.secs > 0) state.secs = s.secs;
        if (typeof s.pace === 'number' && s.pace >= 3 && s.pace <= 20) state.pace = s.pace;
        if (typeof s.pair === 'string') state.pair = s.pair;
        if (typeof s.sound === 'boolean') state.sound = s.sound;
      }
    } catch(e){}
  }
  function saveSettings(){
    try {
      localStorage.setItem(STORE, JSON.stringify({
        tables: state.tables, mode: state.mode, shuffle: state.shuffle,
        timer: state.timer, secs: state.secs, pace: state.pace,
        pair: state.pair, sound: state.sound
      }));
    } catch(e){}
  }

  /* ---------- home ---------- */
  function buildChips(){
    for (var n = MIN; n <= MAX; n++){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('data-n', String(n));
      b.textContent = String(n);
      el.chips.appendChild(b);
    }
    el.chips.addEventListener('click', function(ev){
      var b = ev.target.closest('.chip'); if (!b) return;
      var n = parseInt(b.getAttribute('data-n'), 10);
      var i = state.tables.indexOf(n);
      if (i === -1) state.tables.push(n); else state.tables.splice(i, 1);
      sfx.tap(); paintHome(); saveSettings();
    });
  }

  function setOn(box, attr, val){
    var list = box.querySelectorAll('.opt');
    for (var i = 0; i < list.length; i++){
      list[i].classList.toggle('on', list[i].getAttribute(attr) === String(val));
    }
  }

  function paintTrouble(){
    var worst = troubleList(8);
    el.troubleBlock.classList.toggle('hide', worst.length === 0);
    el.troubleList.innerHTML = '';
    for (var i = 0; i < worst.length; i++){
      var s = document.createElement('span');
      s.className = 'miss';
      s.innerHTML = worst[i].key.replace('×', ' × ') + '<em>' + worst[i].m + '</em>';
      el.troubleList.appendChild(s);
    }
    el.practiceBtn.textContent = 'Practice just these (' + troubleList().length + ')';
  }

  function paintHome(){
    var i, list = el.chips.querySelectorAll('.chip');
    for (i = 0; i < list.length; i++){
      list[i].classList.toggle('on',
        state.tables.indexOf(parseInt(list[i].getAttribute('data-n'), 10)) !== -1);
    }
    setOn(el.modeOpts, 'data-mode', state.mode);
    setOn(el.orderOpts, 'data-shuffle', state.shuffle ? '1' : '0');
    setOn(el.timerOpts, 'data-timer', state.timer);
    setOn(el.secsOpts, 'data-secs', state.secs);

    el.secsBlock.classList.toggle('hide', state.timer !== 'card');
    el.chaseBlock.classList.toggle('hide', state.timer !== 'chase');
    el.pace.value = String(state.pace);
    paintPairs();
    paintPace();

    var count = state.tables.length * PER_TABLE;
    el.startBtn.disabled = state.tables.length === 0;
    el.startBtn.textContent = state.tables.length === 0
      ? 'Pick at least one table' : 'Start ' + count + ' cards';
    paintTrouble();
  }

  el.allBtn.addEventListener('click', function(){
    state.tables = [];
    for (var n = MIN; n <= MAX; n++) state.tables.push(n);
    sfx.tap(); paintHome(); saveSettings();
  });
  el.noneBtn.addEventListener('click', function(){
    state.tables = []; sfx.tap(); paintHome(); saveSettings();
  });
  el.modeOpts.addEventListener('click', function(ev){
    var b = ev.target.closest('.opt'); if (!b) return;
    state.mode = b.getAttribute('data-mode'); sfx.tap(); paintHome(); saveSettings();
  });
  el.orderOpts.addEventListener('click', function(ev){
    var b = ev.target.closest('.opt'); if (!b) return;
    state.shuffle = b.getAttribute('data-shuffle') === '1'; sfx.tap(); paintHome(); saveSettings();
  });
  el.timerOpts.addEventListener('click', function(ev){
    var b = ev.target.closest('.opt'); if (!b) return;
    state.timer = b.getAttribute('data-timer'); sfx.tap(); paintHome(); saveSettings();
  });
  el.secsOpts.addEventListener('click', function(ev){
    var b = ev.target.closest('.opt'); if (!b) return;
    state.secs = parseInt(b.getAttribute('data-secs'), 10); sfx.tap(); paintHome(); saveSettings();
  });
  function buildPairs(){
    for (var i = 0; i < PAIRS.length; i++){
      var p = PAIRS[i];
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pair';
      b.setAttribute('data-pair', p.key);
      b.innerHTML = '<span class="duo">' + p.chaser + p.runner + '</span>' +
                    '<span class="who">' + p.chaserName + ' &amp; ' + p.runnerName + '</span>';
      el.pairOpts.appendChild(b);
    }
    el.pairOpts.addEventListener('click', function(ev){
      var b = ev.target.closest('.pair'); if (!b) return;
      state.pair = b.getAttribute('data-pair');
      sfx.tap(); paintHome(); saveSettings();
    });
  }
  function paintPairs(){
    var list = el.pairOpts.querySelectorAll('.pair');
    for (var i = 0; i < list.length; i++){
      list[i].classList.toggle('on', list[i].getAttribute('data-pair') === state.pair);
    }
    // the Timer button shows whichever pair is picked
    var btn = el.timerOpts.querySelector('.opt[data-timer="chase"]');
    if (btn) btn.textContent = pair().chaser + ' Chase';
  }

  function clock(secs){
    var m = Math.floor(secs / 60), s = Math.round(secs % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function paintPace(){
    el.paceLabel.textContent = state.pace + 's a card';
    el.chaseNote.textContent =
      'One chase per table. ' + PER_TABLE + ' cards at ' + state.pace + 's each, so the ' +
      pair().runnerName + ' has ' + clock(state.pace * PER_TABLE) + ' to get home. ' +
      'Only a right answer moves it along. Get one wrong and that card goes to the back of ' +
      'the queue to come round again, which costs you time.';
  }
  el.pace.addEventListener('input', function(){
    state.pace = parseInt(el.pace.value, 10);
    paintPace();
    saveSettings();
  });

  el.clearMissBtn.addEventListener('click', function(){
    record = {}; saveRecord(); sfx.tap(); paintHome();
  });
  el.practiceBtn.addEventListener('click', function(){
    var worst = troubleList();
    if (!worst.length) return;
    var cards = worst.map(function(w){ return keyToPair(w.key); });
    shuffle(cards);
    startRun([{label: 'Trouble spots', cards: cards}], true);
  });

  function toggleSound(){
    state.sound = !state.sound; applyMute(); saveSettings();
    if (state.sound) sfx.tap();
  }
  el.spkHome.addEventListener('click', toggleSound);
  el.spkPlay.addEventListener('click', function(ev){ ev.stopPropagation(); toggleSound(); });

  /* ---------- deck ---------- */
  function shuffle(arr){
    for (var j = arr.length - 1; j > 0; j--){
      var r = Math.floor(Math.random() * (j + 1));
      var t = arr[j]; arr[j] = arr[r]; arr[r] = t;
    }
    return arr;
  }

  // With the chase on, tables stay whole so each one is a round.
  // Otherwise it is one long round and shuffling can cross tables.
  function buildRounds(){
    var tables = state.tables.slice().sort(function(x, y){ return x - y; });
    var rounds = [], i, m;
    if (state.timer === 'chase'){
      if (state.shuffle) shuffle(tables);
      for (i = 0; i < tables.length; i++){
        var cards = [];
        for (m = MIN; m <= MAX; m++) cards.push([tables[i], m]);
        if (state.shuffle) shuffle(cards);
        rounds.push({label: 'The ' + tables[i] + 's', cards: cards});
      }
    } else {
      var all = [];
      for (i = 0; i < tables.length; i++){
        for (m = MIN; m <= MAX; m++) all.push([tables[i], m]);
      }
      if (state.shuffle) shuffle(all);
      rounds.push({label: '', cards: all});
    }
    return rounds;
  }

  function distractors(a, b){
    var right = a * b;
    var cands = shuffle([a*(b+1), a*(b-1), (a+1)*b, (a-1)*b, right+1, right-1,
                         right+a, right-a, right+b, right-b, (a+1)*(b+1), right+2]);
    var out = [], k = 0;
    for (var i = 0; i < cands.length && out.length < 3; i++){
      if (cands[i] > 0 && cands[i] !== right && out.indexOf(cands[i]) === -1) out.push(cands[i]);
    }
    while (out.length < 3){ k++; if (right + k > 0 && out.indexOf(right + k) === -1) out.push(right + k); }
    return out;
  }

  /* ---------- per card timer ---------- */
  var timerId = null, deadline = 0;
  function stopTimer(){ if (timerId){ cancelAnimationFrame(timerId); timerId = null; } }

  function startTimer(){
    stopTimer();
    if (state.timer !== 'card'){ el.track.classList.add('hidden'); return; }
    el.track.classList.remove('hidden');
    el.fill.classList.remove('warn');
    deadline = Date.now() + state.secs * 1000;
    (function frame(){
      var left = deadline - Date.now();
      var pct = Math.max(0, left) / (state.secs * 1000);
      el.fill.style.transform = 'scaleX(' + pct + ')';
      el.fill.classList.toggle('warn', pct < 0.34);
      if (left <= 0){ timerId = null; timeUp(); return; }
      timerId = requestAnimationFrame(frame);
    })();
  }

  function timeUp(){
    if (state.mode === 'choice'){ if (!state.answered){ sfx.timeUp(); settle(null); } }
    else if (!state.revealed) reveal();
  }

  /* ---------- the chase ----------
     One chase per round. It runs across cards rather than resetting
     with each one, and it holds still while an answer is on screen. */
  var chase = {spent: 0, last: 0, id: null, running: false};

  function chaseOn(){ return state.timer === 'chase'; }
  function budget(){ return state.pace * state.total; }
  // where each of them is along the track, 0 at the start line and 100 at the hole
  function mouseU(){ return HEAD + (100 - HEAD) * (state.cleared / state.total); }
  function catU(){ return 100 * (chase.spent / budget()); }

  function place(node, u){
    node.style.left = (LANE_L + Math.max(0, Math.min(100, u)) / 100 * (HOLE - LANE_L)) + '%';
  }

  function paintLane(){
    var mu = mouseU(), cu = catU();
    place(el.mouse, mu);
    place(el.cat, cu);
    el.lane.classList.toggle('close', mu - cu < 9);
    el.gapTag.textContent = clock(Math.max(0, budget() - chase.spent)) + ' left';
  }

  // the mouse is home the moment the last card is answered, so it cannot be
  // caught on the line. Ties go to the mouse, hence the strict >.
  function chaseCheck(){
    if (!chaseOn() || state.caught) return;
    if (state.cleared >= state.total){ chasePause(); return; }
    if (catU() > mouseU()) caught();
  }

  function chaseFrame(now){
    if (!chase.running) return;
    var dt = Math.min(0.06, (now - chase.last) / 1000);
    chase.last = now;
    chase.spent += dt;
    paintLane();
    if (catU() > mouseU()){ chase.running = false; caught(); return; }
    chase.id = requestAnimationFrame(chaseFrame);
  }

  function chaseStart(){
    chaseStop();
    chase.spent = 0;
    el.lane.classList.toggle('on', chaseOn());
    if (!chaseOn()) return;
    var duo = pair();
    el.cat.textContent = duo.chaser;
    el.mouse.textContent = duo.runner;
    el.hole.textContent = duo.home;
    el.hole.classList.toggle('emoji', !!duo.home);
    el.roundTag.textContent = state.rounds[state.roundIdx].label;
    el.lane.classList.remove('close');
    paintLane();
    chaseResume();
  }
  function chaseResume(){
    if (!chaseOn() || chase.running) return;
    chase.running = true;
    chase.last = performance.now();
    chase.id = requestAnimationFrame(chaseFrame);
  }
  function chasePause(){
    chase.running = false;
    if (chase.id){ cancelAnimationFrame(chase.id); chase.id = null; }
  }
  function chaseStop(){ chasePause(); }

  // the mouse has already been moved by clearCard() before this runs
  function chaseNudge(correct){
    if (!chaseOn()) return;
    if (!correct){
      sfx.pounce();
      el.cat.classList.remove('pounce');
      void el.cat.offsetWidth;                      // restart the animation
      el.cat.classList.add('pounce');
    }
    paintLane();
    chaseCheck();
  }

  function caught(){
    chaseStop(); stopTimer(); clearTimeout(advanceId);
    state.caught = true;
    sfx.caught();
    finish();
  }

  /* ---------- play ---------- */
  function show(screen){
    el.home.classList.toggle('on', screen === 'home');
    el.play.classList.toggle('on', screen === 'play');
    el.doneScreen.classList.toggle('on', screen === 'done');
  }
  function round(){ return state.rounds[state.roundIdx]; }

  /* The round is a queue rather than a straight walk. A card leaves the queue
     only when it is answered correctly, and a miss goes to the back to come
     round again. Outside the chase there is no mouse to earn steps for, so a
     card leaves on any answer and the deck is a single pass as before. */
  function loadRound(){
    state.queue = round().cards.slice();
    state.total = state.queue.length;
    state.cleared = 0;
  }
  function card(){ return state.queue[0]; }
  function clearCard(correct){
    if (correct || !chaseOn()){ state.queue.shift(); state.cleared++; }
    else state.queue.push(state.queue.shift());
  }

  function startRun(rounds, isPractice){
    unlock();
    state.rounds = rounds || buildRounds();
    state.practice = !!isPractice;
    if (!state.rounds.length || !state.rounds[0].cards.length) return;
    state.roundIdx = 0;
    loadRound();
    breaking = false;
    state.right = 0; state.wrong = 0;
    state.streak = 0; state.bestStreak = 0;
    state.missed = []; state.caught = false;
    state.startedAt = Date.now();
    document.body.classList.toggle('choice', state.mode === 'choice');
    show('play');
    chaseStart();
    paintCard();
  }

  function paintScore(){
    el.score.innerHTML = (state.right || state.wrong)
      ? '<b>✓ ' + state.right + '</b><i>✗ ' + state.wrong + '</i>' : '';
  }

  function paintCard(){
    var pair = card();
    var text = pair[0] + ' × ' + pair[1];
    var answer = pair[0] * pair[1];

    state.revealed = false; state.answered = false;
    el.card.classList.remove('flip');
    el.count.textContent = (state.cleared + 1) + ' / ' + state.total;
    el.q.textContent = text;
    el.qsmall.textContent = text;
    el.a.textContent = String(answer);
    paintScore();

    if (state.mode === 'choice'){
      var opts = distractors(pair[0], pair[1]);
      opts.splice(Math.floor(Math.random() * 4), 0, answer);
      el.choices.innerHTML = '';
      for (var i = 0; i < opts.length; i++){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'ch';
        b.setAttribute('data-v', String(opts[i]));
        b.textContent = String(opts[i]);
        el.choices.appendChild(b);
      }
    } else {
      el.hint.textContent = 'Tap the card to see the answer';
      el.grade.classList.remove('on');
      el.nextBtn.style.display = '';
      el.nextBtn.textContent = 'Show answer';
    }
    startTimer();
    chaseResume();
  }

  var toastId = null;
  function toast(msg, big){
    el.toast.textContent = msg;
    el.toast.classList.toggle('big', !!big);
    el.toast.classList.add('show');
    clearTimeout(toastId);
    toastId = setTimeout(function(){ el.toast.classList.remove('show'); }, big ? 1600 : 1500);
  }

  function bump(correct){
    var pair = card();
    var key = pairKey(pair[0], pair[1]);
    noteResult(key, correct);

    if (correct){
      state.right++; state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    } else {
      state.wrong++; state.streak = 0;
      if (state.missed.indexOf(key) === -1) state.missed.push(key);
    }
    paintScore();
    clearCard(correct);      // moves the mouse, or sends the card to the back
    chaseNudge(correct);
    if (correct && state.streak >= 3 && state.streak % 3 === 0){
      setTimeout(function(){ sfx.streak(); }, 340);
      toast(state.streak + ' in a row!');
    }
  }

  /* --- multiple choice --- */
  var advanceId = null;

  function settle(picked){
    if (state.answered) return;
    state.answered = true;
    stopTimer(); chasePause();
    el.track.classList.add('hidden');

    var pair = card();
    var answer = pair[0] * pair[1];
    var correct = picked === answer;
    var btns = el.choices.querySelectorAll('.ch');
    for (var i = 0; i < btns.length; i++){
      var v = parseInt(btns[i].getAttribute('data-v'), 10);
      if (v === answer) btns[i].classList.add('good');
      else if (v === picked) btns[i].classList.add('bad');
      else btns[i].classList.add('dim');
    }
    if (picked !== null) correct ? sfx.right() : sfx.wrong();
    bump(correct);
    if (state.caught) return;

    clearTimeout(advanceId);
    advanceId = setTimeout(step, correct ? 700 : 1500);
  }

  el.choices.addEventListener('click', function(ev){
    var b = ev.target.closest('.ch'); if (!b) return;
    unlock();
    if (state.answered){ clearTimeout(advanceId); step(); return; }
    settle(parseInt(b.getAttribute('data-v'), 10));
  });

  /* --- flip --- */
  function reveal(){
    if (state.revealed) return;
    state.revealed = true;
    stopTimer(); chasePause();
    el.track.classList.add('hidden');
    el.card.classList.add('flip');
    sfx.flip();
    el.hint.textContent = 'Did you get it?';
    el.grade.classList.add('on');
    el.nextBtn.style.display = 'none';
  }

  function grade(correct){
    if (!state.revealed || state.answered) return;
    state.answered = true;
    correct ? sfx.right() : sfx.wrong();
    bump(correct);
    if (state.caught) return;
    clearTimeout(advanceId);
    advanceId = setTimeout(step, correct ? 500 : 900);
  }
  el.gotIt.addEventListener('click', function(){ unlock(); grade(true); });
  el.missedIt.addEventListener('click', function(){ unlock(); grade(false); });

  // set while the escape is playing, so tapping through the pause cannot
  // run the end of the round twice
  var breaking = false;

  function step(){
    clearTimeout(advanceId);
    if (state.caught || breaking) return;
    if (state.queue.length){ paintCard(); return; }
    breaking = true;
    // round cleared
    if (chaseOn()){
      chasePause();
      sfx.escape();
      toast(round().label + ' got away! ' + pair().runner, true);
    }
    if (state.roundIdx + 1 >= state.rounds.length){
      setTimeout(finish, chaseOn() ? 1100 : 0);
      return;
    }
    state.roundIdx++;
    loadRound();
    setTimeout(function(){
      breaking = false;
      if (state.caught) return;
      chaseStart();
      paintCard();
    }, chaseOn() ? 1100 : 0);
  }

  function cardTap(){
    unlock();
    if (state.mode === 'choice') return;
    if (!state.revealed){ reveal(); return; }
    if (state.answered) step();
  }
  el.card.addEventListener('click', cardTap);
  el.nextBtn.addEventListener('click', cardTap);

  function paintMissBox(box, list, keys){
    box.classList.toggle('on', keys.length > 0);
    list.innerHTML = '';
    for (var i = 0; i < keys.length; i++){
      var s = document.createElement('span');
      s.className = 'miss';
      s.textContent = keys[i].replace('×', ' × ');
      list.appendChild(s);
    }
  }

  function finish(){
    stopTimer(); chaseStop(); clearTimeout(advanceId);
    var graded = state.right + state.wrong;
    var secs = Math.round((Date.now() - state.startedAt) / 1000);
    var m = Math.floor(secs / 60), s = secs % 60;

    if (state.caught){
      el.doneEmoji.textContent = pair().chaser;
      el.doneTitle.textContent = 'The ' + pair().chaserName + ' got the ' + pair().runnerName;
      el.doneRing.textContent = '';
      el.doneCards.textContent = round().label
        ? 'Caught during ' + round().label.toLowerCase() : 'Caught';
      el.doneStreak.textContent = graded
        ? state.right + ' right, ' + state.wrong + ' missed' : '';
      el.againBtn.textContent = 'Try again';
    } else {
      var pct = graded ? Math.round(state.right / graded * 100) : 0;
      el.doneEmoji.textContent = chaseOn() ? pair().runner : (pct === 100 ? '🎉' : '');
      el.doneTitle.textContent = chaseOn() ? 'The ' + pair().runnerName + ' got away!'
        : pct === 100 ? 'Perfect!' : pct >= 80 ? 'Nice work' : 'Keep going';
      el.doneRing.textContent = graded ? state.right + ' / ' + graded : '';
      el.doneCards.textContent = graded ? pct + '% right'
        : state.cleared + ' of ' + state.total + ' cards';
      el.doneStreak.textContent = state.bestStreak >= 3
        ? 'Best streak ' + state.bestStreak + ' in a row' : '';
      el.againBtn.textContent = 'Go again';
    }
    el.doneTime.textContent = 'in ' + m + ':' + (s < 10 ? '0' : '') + s;
    paintMissBox(el.missBox, el.missList, state.missed);

    if (!state.caught) sfx.done();
    show('done');
  }

  el.startBtn.addEventListener('click', function(){ startRun(null, false); });
  el.quitBtn.addEventListener('click', function(ev){ ev.stopPropagation(); chaseStop(); finish(); });
  el.againBtn.addEventListener('click', function(){
    if (state.practice){ el.practiceBtn.click(); return; }
    startRun(null, false);
  });
  el.changeBtn.addEventListener('click', function(){ sfx.tap(); paintHome(); show('home'); });

  document.addEventListener('keydown', function(ev){
    if (!el.play.classList.contains('on')) return;
    if (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'ArrowRight'){ ev.preventDefault(); cardTap(); }
  });
  document.addEventListener('click', unlock);

  // a hidden tab freezes rAF anyway; make the pause explicit so nothing
  // jumps forward when it comes back
  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ stopTimer(); chasePause(); }
    else if (el.play.classList.contains('on') && !state.revealed && !state.answered && !state.caught){
      startTimer(); chaseResume();
    }
  });

  loadSettings();
  loadRecord();
  buildChips();
  buildPairs();
  paintHome();
  applyMute();
})();
</script>

</body>
</html>
